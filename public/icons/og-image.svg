<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>

    <!-- Shield gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="40%" style="stop-color:#fb923c"/>
      <stop offset="70%" style="stop-color:#c026d3"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#c026d3"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>

    <!-- Mask for B cutout -->
    <mask id="bCutout">
      <rect width="300" height="350" x="150" y="140" fill="white"/>
      <text
        x="300"
        y="420"
        font-family="Poppins, Arial Black, sans-serif"
        font-size="280"
        font-weight="900"
        text-anchor="middle"
        fill="black"
      >B</text>
    </mask>

    <!-- Shield path -->
    <path id="shieldPath" d="M300 150 L170 200 L170 320 C170 410 300 480 300 480 C300 480 430 410 430 320 L430 200 Z"/>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative blurred circles -->
  <circle cx="100" cy="100" r="150" fill="#f97316" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#a855f7" opacity="0.1"/>
  <circle cx="600" cy="315" r="100" fill="#c026d3" opacity="0.05"/>

  <!-- Shield with B cutout -->
  <use href="#shieldPath" fill="url(#shieldGradient)" mask="url(#bCutout)"/>

  <!-- BLAST text -->
  <text
    x="750"
    y="340"
    font-family="Poppins, Arial Black, sans-serif"
    font-size="120"
    font-weight="800"
    fill="url(#textGradient)"
  >BLAST</text>

  <!-- Tagline -->
  <text
    x="750"
    y="400"
    font-family="Inter, Arial, sans-serif"
    font-size="32"
    font-weight="400"
    fill="rgba(255,255,255,0.7)"
  >Party Games Collection</text>
</svg>
