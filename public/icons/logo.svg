<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Durchgehender Gradient für das gesamte Schild -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="40%" style="stop-color:#fb923c"/>
      <stop offset="70%" style="stop-color:#c026d3"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>

    <!-- Maske für das ausgeschnittene B -->
    <mask id="bCutout">
      <rect width="512" height="512" fill="white"/>
      <text
        x="256"
        y="420"
        font-family="Poppins, Arial Black, sans-serif"
        font-size="500"
        font-weight="900"
        text-anchor="middle"
        fill="black"
      >B</text>
    </mask>

    <!-- Komplettes Schild als Symbol -->
    <path id="shieldPath" d="M256 24 L40 108 L40 248 C40 384 256 488 256 488 C256 488 472 384 472 248 L472 108 Z"/>
  </defs>

  <!-- Schild mit durchgehendem Gradient und B-Ausschnitt -->
  <use href="#shieldPath" fill="url(#shieldGradient)" mask="url(#bCutout)"/>
</svg>
